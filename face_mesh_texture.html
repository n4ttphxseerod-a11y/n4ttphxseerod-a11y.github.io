<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Face Texture</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100%; height: 100%; }
  </style>

  <script>
    // คอมโพเนนต์แปะเท็กซ์เจอร์ลงบนโครงหน้า (MindAR ฝั่ง A-Frame ไม่มีมาให้)
    AFRAME.registerComponent('face-texture', {
      schema: { src: { type: 'string' } },

      init: function () {
        this.el.object3D.matrixAutoUpdate = false;
        this.el.sceneEl.systems['mindar-face-system'].registerFaceMesh(this);
      },

      // MindAR ส่งโครงหน้ามาให้ตอนเริ่มทำงาน
      addFaceMesh: function (faceGeometry) {
        var texture = new THREE.TextureLoader().load(this.data.src);
        try { texture.colorSpace = THREE.SRGBColorSpace; } catch (e) {}
        var material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true
        });
        this.el.setObject3D('mesh', new THREE.Mesh(faceGeometry, material));
      },

      updateVisibility: function (visible) {
        this.el.object3D.visible = visible;
      },

      updateMatrix: function (matrix) {
        this.el.object3D.matrix.set.apply(this.el.object3D.matrix, matrix);
      }
    });
  </script>
</head>

<body>

<a-scene
  mindar-face="faceOccluder: false; uiLoading: yes; uiScanning: yes"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- โครงหน้า + เท็กซ์เจอร์ที่สร้างเอง -->
  <a-entity face-texture="src: face_texture_cat_fit.png"></a-entity>

  <a-camera active="false" position="0 0 0"></a-camera>
</a-scene>

</body>
</html>
