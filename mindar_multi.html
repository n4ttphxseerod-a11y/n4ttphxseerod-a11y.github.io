<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MindAR Multi</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: targets-3.mind; maxTrack: 3; uiLoading: yes; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="60000">
    <a-asset-item id="model0" src="https://nine0209.github.io/3DM1.glb"></a-asset-item>
    <a-asset-item id="model1" src="https://raw.githubusercontent.com/Smiling24-mm/ar-smiling-chat/refs/heads/main/assets/DamagedHelmet.glb"></a-asset-item>
    <a-asset-item id="model2" src="https://raw.githubusercontent.com/phatcharin7338-web/View_AR/refs/heads/main/monster_hunter.glb"></a-asset-item>
  </a-assets>

  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 1" position="1 2 1"></a-entity>

  <!-- รูปการ์ดสาวผมขาว -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#model0" animation-mixer rotation="90 0 0" scale="0.5 0.5 0.5" position="0 0 0"></a-gltf-model>
  </a-entity>

  <!-- รูปแมวดำ -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#model1" animation-mixer rotation="90 0 0" scale="2 2 2" position="0 0 0"></a-gltf-model>
  </a-entity>

  <!-- รูปกระต่ายชมพู -->
  <a-entity mindar-image-target="targetIndex: 2">
    <a-gltf-model src="#model2" animation-mixer rotation="90 0 0" scale="0.5 0.5 0.5" position="0 0 0"></a-gltf-model>
  </a-entity>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
</a-scene>

</body>
</html>
