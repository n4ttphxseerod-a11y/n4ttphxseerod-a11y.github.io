<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Cat Face AR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #container { position: fixed; inset: 0; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.136.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.136.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-face-three';

    // ไฟล์ face_texture_cat_fit.png ต้องอยู่โฟลเดอร์เดียวกับ mindar.html
    const TEXTURE_URL = 'face_texture_cat_fit.png';

    const start = async () => {
      const mindarThree = new MindARThree({
        container: document.querySelector('#container')
      });
      const { renderer, scene, camera } = mindarThree;

      scene.add(new THREE.AmbientLight(0xffffff, 1));

      const texture = await new THREE.TextureLoader().loadAsync(TEXTURE_URL);
      if (THREE.sRGBEncoding !== undefined) texture.encoding = THREE.sRGBEncoding;

      const faceMesh = mindarThree.addFaceMesh();
      faceMesh.material.map = texture;
      faceMesh.material.transparent = true;
      faceMesh.material.needsUpdate = true;
      scene.add(faceMesh);

      await mindarThree.start();
      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    };

    start().catch((e) => {
      console.error(e);
      alert('เริ่มไม่ได้: ' + e.message);
    });
  </script>
</body>
</html>
